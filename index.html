<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Média</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
max-width: 400px;
    }
    input, select, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
    }
    .resultado {
      margin-top: 15px;
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Calculadora de Média</h2>

    <label>Nota da Prova:</label>
    <input type="number" id="prova" step="0.1">

    <label>Nota do Questionário:</label>
    <input type="number" id="questionario" step="0.1">

    <label>Currículo:</label>
    <select id="curriculo">
      <option value="2022">Até 2022</option>
      <option value="2023">2023 ou superior</option>
    </select>

    <label>Bimestre:</label>
    <select id="bimestre">
      <option value="1">1º Bimestre</option>
      <option value="2">2º Bimestre</option>
    </select>

    <button onclick="calcular()">Calcular</button>

    <div id="resultado" class="resultado"></div>
  </div>

  <script>
    function calcular() {
      const prova = parseFloat(document.getElementById('prova').value);
      const questionario = parseFloat(document.getElementById('questionario').value);
      const curriculo = document.getElementById('curriculo').value;
      const bimestre = document.getElementById('bimestre').value;
      const resultadoDiv = document.getElementById('resultado');

      if (isNaN(prova) || isNaN(questionario)) {
        resultadoDiv.innerHTML = 'Preencha todas as notas!';
        resultadoDiv.style.background = 'gray';
        return;
      }

      const media = ((9 * prova) + questionario) / 10;

      let status = '';
      let cor = '';
      let mediaMinima = curriculo === '2022' ? 5.8 : 6.8;

      if (media >= mediaMinima) {
        status = 'APROVADO';
        cor = 'green';
      } else {
        if (bimestre === '1') {
          status = 'RECUPERAÇÃO';
          cor = 'yellow';
        } else {
          status = 'REPROVADO';
          cor = 'red';
        }
      }

      resultadoDiv.innerHTML = `Média: ${media.toFixed(2)} - ${status}`;
      resultadoDiv.style.background = cor;
    }
  </script>
</body> {
  margin: 0;
  padding: 10px;
}
</html>
