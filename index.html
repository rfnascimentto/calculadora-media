<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de Média</title>
<style>
body{font-family:Arial,sans-serif;background:#1e3c72;color:#222;margin:0;padding:20px}
.card{max-width:480px;margin:auto;background:#fff;padding:20px;border-radius:16px}
label{display:block;margin-top:10px}
input,select,button{width:100%;padding:10px;margin-top:5px}
button{background:#1e88e5;color:#fff;border:none;border-radius:8px}
#resultado{margin-top:15px;padding:12px;border-radius:8px;color:#fff;display:none}
footer{text-align:center;color:#fff;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h2>Calculadora de Média</h2>
<label>Curso</label>
<select id="curso" onchange="pimBox.style.display=this.value==='gestao'?'block':'none'">
<option value="normal">Normal</option>
<option value="gestao">Gestão</option>
</select>
<div id="pimBox" style="display:none">
<label>Nota do PIM</label><input id="pim" type="number" min="0" max="10" step="0.1">
</div>
<label>Nota da Prova</label><input id="prova" type="number" min="0" max="10" step="0.1">
<label>Nota do Questionário</label><input id="questionario" type="number" min="0" max="10" step="0.1">
<label>Currículo</label>
<select id="curriculo"><option value="2022">Até 2022</option><option value="2023">2023+</option></select>
<button onclick="calc()">Calcular</button>
<div id="exameBox" style="display:none">
<label>Nota do Exame</label><input id="exame" type="number" min="0" max="10" step="0.1">
<button onclick="calcExame()">Calcular Exame</button>
</div>
<div id="resultado"></div>
</div>
<footer>Created by R F NASCIMENTO</footer>
<script>
let media=0;
function calc(){
 let p=+prova.value,q=+questionario.value;
 if(isNaN(p)||isNaN(q)){alert('Preencha as notas');return;}
 media=(curso.value==='gestao')?((7*p)+(2*(+pim.value||0))+q)/10:((9*p)+q)/10;
 let min=curriculo.value==='2022'?5.8:6.8;
 resultado.style.display='block';
 if(media>=min){
  exameBox.style.display='none';
  resultado.style.background='#28a745';
  resultado.innerHTML='Média: '+media.toFixed(2)+'<br>✅ APROVADO';
 }else{
  exameBox.style.display='block';
  resultado.style.background='#ff9800';
  resultado.innerHTML='Média: '+media.toFixed(2)+'<br>📝 EM EXAME';
 }
}
function calcExame(){
 let e=+exame.value;
 if(isNaN(e)){alert('Informe a nota do exame');return;}
 let mf=(media+e)/2;
 resultado.style.background=mf>=5?'#28a745':'#dc3545';
 resultado.innerHTML='Média Inicial: '+media.toFixed(2)+'<br>Exame: '+e.toFixed(2)+'<br>Média Final: '+mf.toFixed(2)+'<br>'+(mf>=5?'✅ APROVADO APÓS EXAME':'❌ REPROVADO APÓS EXAME');
}
</script>
</body></html>
